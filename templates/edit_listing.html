<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Your Listing | CollegeResell</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f2f7ff, #e5ecff);
            min-height: 100vh;
        }

        h2 {
            font-weight: 800;
            color: #0C63E4;
            text-shadow: 1px 1px 2px #ccc;
        }

        form {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        .form-control, textarea {
            border-radius: 10px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.05);
            transition: 0.3s ease;
        }

        .form-control:focus {
            border-color: #0C63E4;
            box-shadow: 0 0 0 4px rgba(12, 99, 228, 0.2);
        }

        .image-preview {
            position: relative;
            display: inline-block;
            margin: 10px;
            transition: transform 0.3s ease;
        }

        .image-preview:hover {
            transform: scale(1.05);
        }

        .image-preview img {
            max-width: 150px;
            border-radius: 10px;
            border: 2px solid #0C63E4;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .delete-checkbox {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #ffffffdd;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(to right, #0C63E4, #084298);
            border: none;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(12, 99, 228, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            border: none;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 10px;
        }

        .form-section {
            margin-bottom: 25px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .image-preview img {
                max-width: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <h2 class="text-center mb-5"><i class="fas fa-edit me-2"></i>Edit Your Listing</h2>

        <form method="POST" enctype="multipart/form-data">
            <div class="form-section">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" name="category" required>
            <option value="">-- Select Category --</option>
            <option value="Electronics" {% if product.category == 'Electronics' %}selected{% endif %}>Electronics</option>
            <option value="Groceries" {% if product.category == 'Groceries' %}selected{% endif %}>Groceries</option>
            <option value="Study Stuff" {% if product.category == 'Study Stuff' %}selected{% endif %}>Study Stuff</option>
            <option value="Hostel Stuff" {% if product.category == 'Hostel Stuff' %}selected{% endif %}>Hostel Stuff</option>
            <option value="Vehicles" {% if product.category == 'Vehicles' %}selected{% endif %}>Vehicles</option>
            <option value="Others" {% if product.category == 'Others' %}selected{% endif %}>Others</option>
            </select>
            </div>


            <div class="form-section">
                <label for="product_name" class="form-label">Product Name</label>
                <input type="text" class="form-control" name="product_name" value="{{ product.name }}" required>
            </div>

            <div class="form-section">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="3" required>{{ product.description }}</textarea>
            </div>

            <div class="form-section">
                <label for="price" class="form-label">Price (₹)</label>
                <input type="number" class="form-control" name="price" value="{{ product.price }}" required>
            </div>

            <div class="form-section">
                <label for="seller_name" class="form-label">Seller Name</label>
                <input type="text" class="form-control" name="seller_name" value="{{ product.seller_name }}" required>
            </div>

            <div class="form-section">
                <label for="phone" class="form-label">Contact Number</label>
                <input type="text" class="form-control" name="phone" value="{{ product.phone }}" required>
            </div>

            <div class="form-section">
                <label class="form-label">Current Images</label>
                {% if product.image_urls %}
                    <div class="d-flex flex-wrap">
                        {% for url in product.image_urls %}
                        <div class="image-preview">
                            <img src="{{ url }}" alt="Product Image" class="img-thumbnail">
                            <label class="delete-checkbox">
                                <input type="checkbox" name="delete_images" value="{{ url }}"> Delete
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <p>No images available for this product.</p>
                {% endif %}
            </div>

            <div class="form-section">
                <label for="new_images" class="form-label">Add New Images</label>
                <input type="file" class="form-control" name="new_images" multiple>
            </div>

            <div class="mt-4 d-flex gap-3">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i> Update Listing
                </button>
                <a href="/my_listings" class="btn btn-secondary">
                    <i class="fas fa-times me-1"></i> Cancel
                </a>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
