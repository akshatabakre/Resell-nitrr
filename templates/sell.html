<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sell a Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap + Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-section {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.08);
            margin-top: 40px;
            margin-bottom: 60px;
        }
        .form-section h2 {
            margin-bottom: 25px;
            font-weight: bold;
            font-family: 'Segoe UI', sans-serif;
        }
        .form-label {
            font-weight: 500;
        }
        .btn-custom {
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #imagePreviewContainer img {
            width: 120px;
            height: auto;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    {% include 'navbar.html' %}

    <div class="container">
        <div class="form-section">
            <h2><i class="fas fa-upload"></i> Sell a Product</h2>
            <form id="sellForm" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-tags me-2"></i>Category</label>
                    <select name="category" class="form-select" required>
                        <option value="">-- Select Category --</option>
                        <option value="electronics">Electronics</option>
                        <option value="groceries">Groceries</option>
                        <option value="study stuff">Study Stuff</option>
                        <option value="hostel stuff">Hostel Stuff</option>
                        <option value="vehicles">Vehicles</option>
                        <option value="others">Others</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-box-open me-2"></i>Product Name</label>
                    <input type="text" name="product_name" class="form-control" placeholder="Enter product name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-align-left me-2"></i>Product Description</label>
                    <textarea name="description" rows="4" class="form-control" placeholder="Enter a brief description..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-rupee-sign me-2"></i>Asking Price</label>
                    <input type="number" name="price" class="form-control" placeholder="₹ e.g. 500" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-image me-2"></i>Product Images</label><br>
                    <div id="imagePreviewContainer" class="mb-3 d-flex flex-wrap"></div>
                    <input type="file" id="imageInput" accept="image/*" style="display:none;">
                    <button type="button" id="addImageBtn" class="btn btn-outline-primary btn-sm"><i class="fas fa-plus me-1"></i>Add Image</button>
                    <div id="hiddenImageInputs"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-user me-2"></i>Seller Name</label>
                    <input type="text" name="seller_name" class="form-control" placeholder="Your full name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-phone me-2"></i>Phone Number</label>
                    <input type="tel" name="phone" class="form-control" placeholder="10-digit phone number" required pattern="[0-9]{10}">
                </div>

                <button type="submit" class="btn btn-success btn-lg btn-custom"><i class="fas fa-check-circle me-2"></i>List Product</button>
                <a href="/protected_area" class="btn btn-secondary btn-lg btn-custom ms-2"><i class="fas fa-arrow-left me-1"></i>Back</a>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const imageInput = document.getElementById('imageInput');
            const addImageBtn = document.getElementById('addImageBtn');
            const previewContainer = document.getElementById('imagePreviewContainer');
            const hiddenInputs = document.getElementById('hiddenImageInputs');
            let imageCount = 0;

            addImageBtn.addEventListener('click', () => {
                imageInput.click();
            });

            imageInput.addEventListener('change', () => {
                for (let i = 0; i < imageInput.files.length; i++) {
                    const file = imageInput.files[i];
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        previewContainer.appendChild(img);
                    };
                    reader.readAsDataURL(file);

                    const blobInput = document.createElement('input');
                    blobInput.type = 'file';
                    blobInput.name = 'image';
                    blobInput.files = createFileList([file]);
                    blobInput.style.display = 'none';
                    hiddenInputs.appendChild(blobInput);

                    imageCount++;
                }
                imageInput.value = '';
            });

            function createFileList(files) {
                const dataTransfer = new DataTransfer();
                files.forEach(file => dataTransfer.items.add(file));
                return dataTransfer.files;
            }
        });
    </script>
</body>
</html>
