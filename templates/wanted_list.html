<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wanted Products | Campus Resell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/favicon.png" type="image/png">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- AOS (Animate On Scroll) -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f8f9fc;
      color: #212529;
      margin: 0;
    }

    h2 {
      font-weight: 800;
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
      padding-top: 30px;
    }

    .search-box {
      text-align: center;
      margin-bottom: 30px;
      padding: 35px;
    }

    .search-box input {
      width: 90%;
      max-width: 450px;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    .search-box input:focus {
      border-color: #0d6efd;
      outline: none;
    }

    .card-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
      padding-top: 20px;
    }

    .product-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      transition: all 0.3s ease;
      padding: 25px;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08);
    }

    .product-info b {
      font-size: 1.3rem;
      color: #0d6efd;
      display: block;
      margin-bottom: 10px;
    }

    .product-info p {
      margin-bottom: 12px;
      color: #495057;
      font-size: 0.95rem;
    }

    .product-info small {
      display: block;
      padding: 10px 15px;
      background-color: #f1f3f5;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #555;
      line-height: 1.6;
    }

    .product-info small i {
      margin-right: 6px;
    }

    .whatsapp-btn {
      background-color: #25d366;
      border: none;
      color: white;
      padding: 8px 20px;
      font-size: 0.9rem;
      border-radius: 50px;
      display: inline-flex;
      align-items:center;
      gap: 8px;
      transition: background-color 0.3s ease;
      text-decoration: none;
     
    }

    .whatsapp-btn:hover {
      background-color: #1ebe5d;
      text-decoration: none;
      color: white;
    }

    @media (max-width: 768px) {
      h2 {
        font-size: 1.8rem;
      }

      .search-box input {
        width: 95%;
      }
    }
  </style>
</head>
<body>

  {% include 'navbar.html' %}

  <div data-aos="fade-down">
    <h2>🎯 Students' Wanted Product List</h2>
  </div>

  <div class="search-box" data-aos="fade-up">
    <input type="text" id="searchInput" placeholder="Search wanted items..." onkeyup="filterItems()" />
  </div>

  <div class="card-list" id="wantedList">
    {% for item in wanted_items %}
    <div class="product-card" data-aos="fade-up">
      <div class="product-info">
        <b><i class="fa-solid fa-box-open"></i> {{ item.name }}</b>
        <p><i class="fa-solid fa-align-left"></i> {{ item.description or 'No description provided' }}</p>
        <small>
          <i class="fa fa-user"></i> Buyer: {{ item.buyer_name }}<br>
          <i class="fa fa-phone"></i> Contact: {{ item.contact }}
        </small>

        <!-- WhatsApp Message Button -->
        <div class="mt-3 text-center">
          <a 
            href="https://wa.me/{{ item.contact | replace(' ', '') }}?text=Hey%2C%20I%20have%20this%20item%20you%20requested%3A%20{{ item.name | urlencode }}" 
            target="_blank" 
            class="whatsapp-btn"
          >
            <i class="fab fa-whatsapp"></i> 
          </a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init();

    function filterItems() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.querySelectorAll(".product-card");
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "block" : "none";
      });
    }
  </script>

</body>
</html>
