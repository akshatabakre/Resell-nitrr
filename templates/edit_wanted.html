<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Wanted Item</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f2f7ff, #e5ecff);
            min-height: 100vh;
        }

        h2 {
            font-weight: 800;
            color: #0C63E4;
            text-shadow: 1px 1px 2px #ccc;
        }

        form {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.8s ease;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        .form-control, textarea {
            border-radius: 10px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.05);
            transition: 0.3s ease;
        }

        .form-control:focus {
            border-color: #0C63E4;
            box-shadow: 0 0 0 4px rgba(12, 99, 228, 0.2);
        }

        .btn-primary {
            background: linear-gradient(to right, #0C63E4, #084298);
            border: none;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(12, 99, 228, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            border: none;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 10px;
        }

        .form-section {
            margin-bottom: 25px;
        }

        .form-check-label {
            font-weight: 500;
            color: #444;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <h2 class="text-center mb-5"><i class="fas fa-edit me-2"></i>Edit Your Wanted Item</h2>

        <form method="POST">
            <div class="form-section">
                <label for="name" class="form-label">Your Name:</label>
                <input type="text" class="form-control" name="name" value="{{ wanted.buyer_name }}" required>
            </div>

            <div class="form-section">
                <label for="product_name" class="form-label">Product Name:</label>
                <input type="text" class="form-control" name="product_name" value="{{ wanted.name }}" required>
            </div>

            <div class="form-section">
                <label for="description" class="form-label">Description:</label>
                <textarea class="form-control" name="description" rows="3">{{ wanted.description }}</textarea>
            </div>

            <div class="form-section">
                <label for="contact" class="form-label">Contact Number:</label>
                <input type="text" class="form-control" name="contact" value="{{ wanted.contact }}" required>
            </div>

            <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" name="mark_fulfilled" value="yes" id="markFulfilled">
                <label class="form-check-label" for="markFulfilled">
                    Mark this wanted item as fulfilled (will be removed)
                </label>
            </div>

            <div class="mt-4 d-flex gap-3">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i> Update Wanted Item
                </button>
                <a href="/my_listings" class="btn btn-secondary">
                    <i class="fas fa-times me-1"></i> Cancel
                </a>
            </div>
        </form>

        <!-- Back to Dashboard Button -->
        <div class="text-center mt-5">
            <a href="/protected_area" class="btn btn-outline-primary btn-lg shadow-sm px-4">
                <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
