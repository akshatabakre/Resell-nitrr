<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sell a Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <!-- Include Bootstrap CSS (if not already in styles.css) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
       body{
            background: url('/static/dashboard bg.jpg') no-repeat center center fixed;
            content: "";
            /* position: fixed; */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* background: url('/static/dsbg.jpg') no-repeat center center fixed; */
            background-size: cover;
            filter: brightness(0.9);
            z-index: -2;
            color: white;
            /* padding-top: 70px; */
            padding-bottom: 0;
        }
        body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        height: 100%;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.4); /* Adjust opacity here */
        z-index: -1;
    }
    </style>
</head>
<body>

    {% include 'navbar.html' %}

    <div class="container mt-4">
        <h2>Sell a Product</h2>
        <form id="sellForm" method="post" enctype="multipart/form-data">
            <label>Category:</label>
            <select name="category" class="form-select">
                <option value="electronics">Electronics</option>
                <option value="groceries">Groceries</option>
                <option value="study stuff">Study Stuff</option>
                <option value="hostel stuff">Hostel Stuff</option>
                <option value="vehicles">Vehicles</option>
                <option value="others">Others</option>
            </select><br>

            <label>Product Name:</label>
            <input type="text" name="product_name" required class="form-control"><br>

            <label>Product Description:</label>
            <textarea name="description" rows="4" cols="50" class="form-control"></textarea><br>

            <label>Asking Price: ₹</label>
            <input type="number" name="price" required class="form-control"><br>

            <label>Product Images:</label>
            <div id="imagePreviewContainer" style="margin-bottom: 10px;"></div>

            <input type="file" id="imageInput" accept="image/*" style="display:none;">
            <button type="button" id="addImageBtn" class="btn btn-primary">➕ Add Image</button><br><br>

            <div id="hiddenImageInputs"></div>

            <label>Seller Name:</label>
            <input type="text" name="seller_name" required class="form-control"><br>

            <label>Phone Number:</label>
            <input type="tel" name="phone" required class="form-control"><br>

            <input type="submit" value="List Product" class="btn btn-success">
        </form>
        <br>
        <a href="/protected_area" class="btn btn-secondary">Back</a>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const imageInput = document.getElementById('imageInput');
        const addImageBtn = document.getElementById('addImageBtn');
        const previewContainer = document.getElementById('imagePreviewContainer');
        const hiddenInputs = document.getElementById('hiddenImageInputs');
        const form = document.getElementById('sellForm');

        let imageCount = 0;

        addImageBtn.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', () => {
            for (let i = 0; i < imageInput.files.length; i++) {
                const file = imageInput.files[i];
                const reader = new FileReader();

                reader.onload = function (e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.style.width = '150px';
                    img.style.margin = '10px';
                    img.style.border = '1px solid #ccc';
                    img.style.padding = '5px';
                    img.style.borderRadius = '4px';
                    previewContainer.appendChild(img);
                };
                reader.readAsDataURL(file);

                const blobInput = document.createElement('input');
                blobInput.type = 'file';
                blobInput.name = 'image';
                blobInput.files = createFileList([file]);
                blobInput.style.display = 'none';
                hiddenInputs.appendChild(blobInput);

                imageCount++;
            }

            imageInput.value = '';
        });

        function createFileList(files) {
            const dataTransfer = new DataTransfer();
            files.forEach(file => dataTransfer.items.add(file));
            return dataTransfer.files;
        }
    });
    </script>
</body>
</html>
