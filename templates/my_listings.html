{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">My Listings</h2>
    {% for product in products %}
        <form method="POST" class="border p-3 mb-4 bg-light rounded">
            <input type="hidden" name="product_id" value="{{ product._id }}">
            <div class="mb-2"><strong>Status:</strong> {{ product.status }}</div>

            <label>Name:</label>
            <input type="text" name="name" value="{{ product.name }}" class="form-control mb-2" required>

            <label>Description:</label>
            <textarea name="description" class="form-control mb-2" required>{{ product.description }}</textarea>

            <label>Price:</label>
            <input type="number" name="price" value="{{ product.price }}" class="form-control mb-2" required>

            <label>Seller Name:</label>
            <input type="text" name="seller_name" value="{{ product.seller_name }}" class="form-control mb-2" required>

            <label>Phone:</label>
            <input type="text" name="phone" value="{{ product.phone }}" class="form-control mb-2" required>

            <div class="d-flex justify-content-between">
                <button type="submit" name="action" value="edit" class="btn btn-primary">Save Changes</button>
                <button type="submit" name="action" value="mark_sold" class="btn btn-danger">Mark as Sold</button>
            </div>
        </form>
    {% else %}
        <p>No listings found.</p>
    {% endfor %}
</div>
{% endblock %}
