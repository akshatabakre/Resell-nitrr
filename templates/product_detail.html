<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ product.name }} | Resell</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      color: #111;
      padding: 30px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      max-width: 1200px;
      margin: auto;
    }

    .gallery {
      flex: 1 1 25%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .gallery a img {
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #ddd;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery a img:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      border-color: #0f62fe;
    }

    .main-image {
      flex: 1 1 45%;
    }

    .main-image img {
      width: 100%;
      border-radius: 12px;
      border: 2px solid #ccc;
      animation: fadeIn 0.6s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .details {
      flex: 1 1 30%;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      position: sticky;
      top: 30px;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .details h1 {
      font-size: 1.75rem;
      margin-bottom: 15px;
    }

    .price {
      font-size: 2rem;
      font-weight: bold;
      color: #2e7d32;
      margin-bottom: 20px;
    }

    .meta p {
      margin: 10px 0;
    }

    .whatsapp {
      margin-top: 20px;
      display: block;
      padding: 12px;
      background: #25d366;
      color: white;
      text-align: center;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .whatsapp:hover {
      background: #1da851;
    }

    @media (max-width: 992px) {
      .container {
        flex-direction: column;
      }

      .main-image, .gallery, .details {
        width: 100%;
      }

      .gallery {
        flex-direction: row;
        overflow-x: auto;
      }

      .gallery a img {
        width: 100px;
        height: 100px;
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Side Gallery -->
    <div class="gallery">
      {% for url in product.image_urls %}
      <a href="{{ url }}" target="_blank">
        <img src="{{ url }}" alt="Product Thumbnail" />
      </a>
      {% endfor %}
    </div>

    <!-- Main Image -->
    <div class="main-image">
      <img src="{{ product.image_urls[0] }}" alt="Main Product Image">
    </div>

    <!-- Product Info -->
    <div class="details">
      <h1>{{ product.name }}</h1>
      <div class="price">₹{{ product.price }}</div>

      <div class="meta">
        <p><strong>Category:</strong> {{ product.category }}</p>
        <p><strong>Description:</strong> {{ product.description }}</p>
        <p><strong>Seller:</strong> {{ product.seller_name }}</p>
        <p><strong>Contact:</strong> {{ product.phone }}</p>
      </div>

      <a class="whatsapp" href="https://wa.me/{{ product.phone | replace('+91', '') }}?text=Hi%20{{ product.seller_name }},%20I%20am%20interested%20in%20your%20product%20{{ product.name }}">
        Chat with Seller on WhatsApp
      </a>
    </div>
  </div>
</body>
</html>
