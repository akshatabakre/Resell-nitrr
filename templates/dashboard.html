<!-- templates/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - CollegeMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f8f5;
    }
    .card {
      margin-top: 100px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-success">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">CollegeMarket</a>
    <a class="btn btn-outline-light" href="/logout">Logout</a>
  </div>
</nav>

<div class="container">
  <div class="card mx-auto" style="max-width: 600px;">
    <div class="card-body text-center">
      <h2 class="card-title">Welcome, {{ user.name }}</h2>
      <p class="card-text">Email: {{ user.email }}</p>
      <div class="d-grid gap-2 d-md-block mt-4">
        <a href="/buy" class="btn btn-primary btn-lg me-3">Buy Products</a>
        <a href="/sell" class="btn btn-success btn-lg">Sell Products</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
