{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <!-- Images Section -->
        <div class="col-md-6 d-flex flex-row flex-wrap">
            {% for url in product.image_urls %}
            <a href="{{ url }}" target="_blank">
                <img src="{{ url }}" alt="Product Image" class="img-thumbnail mx-2 mb-2" style="width: 150px; height: auto; border: 1px solid #ccc;">
            </a>
            {% endfor %}
        </div>

        <!-- Product Details Section -->
        <div class="col-md-6">
            <h2>{{ product.name }}</h2>
            <p><strong>Category:</strong> {{ product.category }}</p>
            <p><strong>Description:</strong> {{ product.description }}</p>
            <p><strong>Price:</strong> ₹{{ product.price }}</p>
            <p><strong>Seller:</strong> {{ product.seller_name }}</p>
            <p><strong>Contact:</strong> {{ product.phone }}</p>
        </div>
    </div>
</div>
{% endblock %}
