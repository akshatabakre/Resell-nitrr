<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wanted Products | Campus Resell</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Favicon -->
    <link rel="icon" href="/static/favicon.png" type="image/png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Animate on Scroll (AOS) -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f2f5;
            overflow-x: hidden;
        }

        h2 {
            margin-top: 50px;
            text-align: center;
            font-weight: bold;
            color: #222;
            padding-top: 30px;
            letter-spacing: 1px;
        }

        .card-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
        }

        .product-card {
            background: rgba(240, 248, 255, 0.8); /* bluish white (aliceblue with opacity) */
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(12px);
            border: 3px solid transparent;
            transition: transform 0.3s ease, border 0.5s;
            position: relative;
        }

        .product-card::before {
            content: "";
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            z-index: -1;
            border-radius: 20px;
            background: linear-gradient(45deg, #084298, #0C63E4, #0096c7, #00b4d8, #48cae4);
            background-size: 400% 400%;
            animation: gradientBorder 6s ease infinite;
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
        }

        .product-info b {
            font-size: 1.3rem;
            color: #003366;
            display: block;
        }

        .product-info p {
            margin-top: 10px;
            color: #333;
        }

        .product-info small {
            display: block;
            margin-top: 12px;
            background-color: #e6f0ff;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .product-info small:hover {
            background-color: #cce0ff;
            transform: scale(1.02);
        }

       

        

        

        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        

        .search-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-box input {
            width: 50%;
            max-width: 400px;
            border-radius: 25px;
            padding: 10px 20px;
            border: 1px solid #ccc;
            outline: none;
        }

        @media (max-width: 768px) {
            .search-box input {
                width: 80%;
            }
        }
    </style>
</head>
<body>

{% include 'navbar.html' %}

<h2 data-aos="fade-down">🎯 Requested Products by Students</h2>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search wanted items..." onkeyup="filterItems()">
</div>

<div class="card-list" id="wantedList">
    {% for item in wanted_items %}
    <div class="product-card" data-aos="zoom-in">
        <div class="product-info">
            <b><i class="fa-solid fa-box"></i> {{ item.name }}</b>
            <p><i class="fa-solid fa-align-left"></i> {{ item.description or 'No description provided' }}</p>
            <small>
                <i class="fa fa-user"></i> Buyer: {{ item.buyer_name }}<br>
                <i class="fa fa-phone"></i> Contact: {{ item.contact }}
            </small>
        </div>
    </div>
    {% endfor %}
</div>



<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- AOS -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init();

    const btn = document.getElementById("backToTopBtn");
    window.onscroll = function () {
        btn.style.display = (window.scrollY > 300) ? "block" : "none";
    };

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterItems() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const cards = document.querySelectorAll(".product-card");
        cards.forEach(card => {
            const text = card.innerText.toLowerCase();
            card.style.display = text.includes(input) ? "block" : "none";
        });
    }
</script>

</body>
</html>
