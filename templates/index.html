<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CollegeResell | Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="google-site-verification" content="s6tR4i08SIgaCAkKKn8bjo39TxietPnOI2wq5PH3ukg" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        /* Background layers */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('static/home bg.jpg') no-repeat center center fixed;
            background-size: cover;
            filter: brightness(0.69);
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        .center-box {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            padding-top: 120px;
            /* padding-left: 80px; */
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .welcome-title {
            font-size: 3rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(225, 65, 201, 0.8);
            margin-bottom: 30px;
        }

        .google-btn {
            display: inline-flex;
            align-items: center;
            background-color: white;
            color: #444;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }

        .google-btn:hover {
            background-color: #f1f1f1;
        }

        .google-btn img {
            width: 20px;
            margin-right: 10px;
        }

        /* Responsive tweaks */
        @media (max-width: 768px) {
            .welcome-title {
                font-size: 2.2rem;
            }

            .google-btn {
                padding: 10px 16px;
                font-size: 0.95rem;
            }

            .google-btn img {
                width: 18px;
                margin-right: 8px;
            }
        }
    </style>
</head>
<body>
{% include 'loader.html' %}
    <div class="center-box">
        <div class="welcome-title">Welcome to College Market</div>
        <a class="google-btn" href="/login">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Google_Favicon_2025.svg/250px-Google_Favicon_2025.svg.png" alt="Google logo">
            Login with Google
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
